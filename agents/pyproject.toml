[project]
name = "trip-concierge-agents"
version = "0.1.0"
description = "Trip Concierge agents: CrewAI crew (Researcher, Local Expert, Logistics, Budget Auditor)."
requires-python = "==3.12.*"
dependencies = [
    "crewai==1.14.5",
    "pytest==9.0.3",
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "ruff==0.15.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["researcher.py", "crew.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]
