# uv workspace root. Not a publishable package — just the workspace member list.
# Each project member has its own [project] table and venv; this file lets
# them resolve cross-member dependencies via path (e.g. backend imports
# trip_agents.schemas without going through PyPI).
#
# mcp_server joined the workspace in slice 3.1, src-layout per the same
# decision agents took in slice 2.5a.

[project]
name = "trip-concierge"
version = "0.1.0"
requires-python = "==3.12.*"

[tool.uv.workspace]
members = ["backend", "agents", "mcp_server"]
