[project]
name = "trip-concierge-mcp-server"
version = "0.1.0"
description = "Trip Concierge MCP server: stdio + HTTP transport over the FastAPI backend."
requires-python = "==3.12.*"
dependencies = [
    # 1.26.0 matches what crewai 1.14.5 pins as a transitive dep (>=1.26,<1.27).
    # When mcp_server joined the workspace in slice 3.1, both needed to
    # resolve to one version. Downgrade from 1.27.1 is intentional — keeping
    # crewai upgrade pressure separate from MCP SDK upgrade pressure.
    "mcp==1.27.2",
    "pytest==9.1.0",
    "trip-concierge-agents",
]

[tool.uv.sources]
trip-concierge-agents = { workspace = true }

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/trip_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
