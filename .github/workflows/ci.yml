name: CI

# pull_request (NOT pull_request_target) is the TanStack-attack-safe trigger:
# the workflow runs in the fork's read-only context with no access to secrets.
on:
  push:
    branches: [main]
  pull_request:

# Default the GITHUB_TOKEN to read-only. Steps that need more must opt in
# per-job. See CLAUDE.md "Hard rules" §5.
permissions:
  contents: read

# Cancel an in-flight PR run when a new commit lands on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # pnpm version is pinned via web/package.json "packageManager". Corepack
      # ships with Node and activates that exact version — no separate pnpm
      # action SHA to pin.
      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install all project deps
        run: make setup

      - name: Lint and typecheck (ruff, mypy, biome, tsc)
        run: make check

      - name: Test (pytest x2 + vitest)
        run: make test
