[project]
name = "trip-concierge-backend"
version = "0.1.0"
description = "Trip Concierge backend: FastAPI service + CrewAI agents."
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pytest==9.0.3",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.50",
    "uvicorn==0.48.0",
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "ruff==0.15.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
