[project]
name = "trip-concierge-backend"
version = "0.1.0"
description = "Trip Concierge backend: FastAPI service + CrewAI agents."
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.18.5",
    "arq==0.28.0",
    "email-validator==2.3.0",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    # PyJWT for MCP token signing/verifying. Chose over python-jose because
    # of better maintenance and a cleaner security advisory history.
    "pyjwt==2.13.0",
    "pytest==9.1.1",
    "python-dotenv==1.2.2",
    "slowapi==0.1.10",
    "sqlalchemy==2.0.51",
    "trip-concierge-agents",
    "uvicorn==0.51.0",
]

[project.scripts]
# Dev-only CLI for issuing MCP JWTs. Used during slices 3.1 → 4.0 while
# the production magic-link flow is unbuilt (lands in slice 4.1).
tc-issue-mcp-token = "app.cli.issue_mcp_token:main"

[tool.uv.sources]
trip-concierge-agents = { workspace = true }

[dependency-groups]
dev = [
    "mutmut>=3.6.0",
    "mypy==2.2.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.21",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"

# Mutmut 3.x mutation testing config (trip-concierge-ht5).
# `source_paths` scopes the run to backend app code only; tests +
# migrations are excluded — mutating tests would be meaningless and
# Alembic versions are auto-generated.
[tool.mutmut]
source_paths = ["app/"]
pytest_add_cli_args_test_selection = ["tests/"]
